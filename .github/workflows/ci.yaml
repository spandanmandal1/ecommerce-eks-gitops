# CI for Product Catalog Service
#
# Pull requests: build, unit tests, lint, image build + Trivy scan (no push).
# Push to main:  the same, then push the image and commit the new tag to the
#                Kubernetes manifest.
#                Argo CD picks up that commit and rolls it out (GitOps).

name: product-catalog-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main]
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci.yaml"

concurrency:
  group: product-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKER_USERNAME }}/product-catalog
  MANIFEST: kubernetes/productcatalog/deploy.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/product-catalog/go.mod
          cache-dependency-path: src/product-catalog/go.sum

      - name: Build
        working-directory: src/product-catalog
        run: |
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/product-catalog/go.mod
          cache-dependency-path: src/product-catalog/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: src/product-catalog
          # Lint changes only; the service code itself comes from the upstream demo.
          only-new-issues: true

  docker:
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

      # Fail the pipeline on CRITICAL vulnerabilities that already have a fix.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  update-manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in the Kubernetes manifest
        run: |
          sed -i "s|image: .*/product-catalog:.*|image: ${IMAGE}:${{ needs.docker.outputs.tag }}|" "$MANIFEST"
          git diff --stat

      # The manifest lives outside the paths above, so this commit does not retrigger CI.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git diff --cached --quiet && exit 0
          git commit -m "[CI]: product-catalog image ${{ needs.docker.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:main
