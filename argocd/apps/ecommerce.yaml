# The shop itself. CI commits new image tags under kubernetes/, Argo CD syncs them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/spandanmandal1/ecommerce-eks-gitops.git
    targetRevision: main
    path: kubernetes
    directory:
      recurse: true
      # Rendered all-in-one copy of the same services; applying both would conflict.
      exclude: complete-deploy.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
